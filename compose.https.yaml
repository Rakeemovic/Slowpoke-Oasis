# Adds Caddy in front of Slowpoke Oasis, which gets a certificate from
# Let's Encrypt for DOMAIN and renews it by itself. The domain must point to
# this machine, and ports 80 and 443 must be reachable from the internet.
#
#   DOMAIN=money.example.org docker compose -f compose.yaml -f compose.https.yaml up -d --build
services:
  slowpoke:
    # Only Caddy talks to the server; it is not published on its own.
    ports: !reset []
    environment:
      COOKIE_SECURE: "true"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - slowpoke
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to your domain, e.g. DOMAIN=money.example.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive restarts, so Let's Encrypt is not asked again.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
